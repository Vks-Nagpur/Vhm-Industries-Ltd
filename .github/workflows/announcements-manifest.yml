name: Build Announcements Manifest

on:
  push:
    branches:
      - main
    paths:
      - "pdfs/**"
      - "scripts/generate_announcements_manifest.py"
      - ".github/workflows/announcements-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate announcements manifest
        run: python scripts/generate_announcements_manifest.py

      - name: Commit manifest when changed
        run: |
          if git diff --quiet -- pdfs/announcements.js; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdfs/announcements.js
          git commit -m "Update announcements manifest"
          git push
